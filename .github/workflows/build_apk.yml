name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files ==="
          ls -la
          echo "=== buildozer.spec exists? ==="
          ls -la buildozer.spec || echo "buildozer.spec not found!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-dev \
            build-essential \
            zlib1g-dev \
            ncurses-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            autoconf \
            libtool \
            pkg-config \
            libsqlite3-dev \
            unzip \
            zip \
            wget \
            curl \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libmtdev-dev \
            xclip \
            xsel

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --upgrade buildozer cython
          echo "=== Buildozer version ==="
          buildozer --version

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v4-${{ runner.os }}-

      - name: Clean old build files
        run: |
          echo "=== Cleaning old build files ==="
          rm -rf .buildozer bin build.log
          echo "=== Clean done ==="

      - name: Build APK
        id: build
        run: |
          set -e
          set -o pipefail

          echo "=== Starting Buildozer APK build ==="
          echo "Java version:"
          java -version
          echo "Python version:"
          python3 --version
          echo "Buildozer version:"
          buildozer --version

          # 执行buildozer打包，不使用管道避免掩盖错误
          buildozer android debug 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo "=== Buildozer exit code: $BUILD_EXIT_CODE ==="

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=== BUILD FAILED! Last 300 lines of log ==="
            tail -300 build.log
            echo "=== Searching for errors ==="
            grep -i -E "error|failed|exception|traceback|fatal" build.log | tail -50 || echo "No error keywords found"
            exit $BUILD_EXIT_CODE
          fi

          echo "=== BUILD SUCCESS ==="
          echo "=== Generated files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          ls -la bin/ 2>/dev/null || echo "No bin directory"

      - name: Find APK files
        if: always()
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== bin directory ==="
          ls -la bin/ 2>/dev/null || echo "No bin directory"
          echo "=== build.log exists? ==="
          ls -la build.log 2>/dev/null || echo "No build.log"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: offline-qa-apk
          path: |
            **/*.apk
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
