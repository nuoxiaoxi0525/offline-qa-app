name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files ==="
          ls -la
          echo "=== buildozer.spec exists? ==="
          ls -la buildozer.spec || echo "buildozer.spec not found!"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-dev \
            build-essential \
            zlib1g-dev \
            ncurses-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            autoconf \
            libtool \
            pkg-config \
            libsqlite3-dev \
            unzip \
            zip \
            wget \
            curl \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libmtdev-dev \
            xclip \
            xsel

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --upgrade buildozer cython
          echo "=== Buildozer version ==="
          buildozer --version

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-v6-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v5-${{ runner.os }}-

      - name: Clean old build files
        run: |
          echo "=== Cleaning old build files ==="
          # Keep .buildozer to allow cache reuse; remove only build outputs and logs
          rm -rf bin build.log
          echo "=== Clean done ==="

      - name: Ensure Android NDK (r28c) is present (cached)
        run: |
          set -euo pipefail
          NDK_DIR="$HOME/.buildozer/android/platform/android-ndk-r28c"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK already present: $NDK_DIR"
          else
            echo "NDK not present. Downloading android-ndk-r28c..."
            mkdir -p "$(dirname "$NDK_DIR")"
            URL="https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
            TMPDIR="$(mktemp -d)"
            RETRIES=5
            SUCCESS=0
            for i in $(seq 1 $RETRIES); do
              echo "Attempt $i of $RETRIES to download NDK..."
              if curl -fSL --retry 3 --retry-delay 10 "$URL" -o "$TMPDIR/ndk.zip"; then
                SUCCESS=1
                break
              else
                echo "NDK download attempt $i failed; sleeping before retry"
                sleep $((i * 10))
              fi
            done
            if [ "$SUCCESS" -ne 1 ]; then
              echo "NDK download failed after $RETRIES attempts" >&2
              exit 1
            fi
            echo "Extracting NDK..."
            unzip -q "$TMPDIR/ndk.zip" -d "$TMPDIR"
            mv "$TMPDIR/android-ndk-r28c" "$NDK_DIR"
            rm -rf "$TMPDIR"
            echo "NDK installed to $NDK_DIR"
          fi
          echo "=== NDK version ==="
          cat "$NDK_DIR/source.properties" 2>/dev/null || echo "Could not read NDK version"

      - name: Build APK
        id: build
        run: |
          set -e
          set -o pipefail

          echo "=== Starting Buildozer APK build ==="
          echo "Java version:"
          java -version
          echo "Python version:"
          python3 --version
          echo "Buildozer version:"
          buildozer --version

          # 执行buildozer打包，不使用管道避免掩盖错误
          buildozer android debug 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo "=== Buildozer exit code: $BUILD_EXIT_CODE ==="

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=== BUILD FAILED! Total log lines: $(wc -l < build.log) ==="
            echo "=== Last 200 lines of log ==="
            tail -200 build.log
            echo ""
            echo "=== Searching for error keywords with context ==="
            grep -n -i -E "error|failed|exception|traceback|fatal|cannot|unable|not found|permission" build.log | tail -30 || echo "No error keywords found"
            echo ""
            echo "=== Lines around 'Buildozer failed' ==="
            grep -n "Buildozer failed" build.log | head -5
            FAILED_LINE=$(grep -n "Buildozer failed" build.log | head -1 | cut -d: -f1)
            if [ -n "$FAILED_LINE" ] && [ "$FAILED_LINE" -gt 100 ]; then
              START_LINE=$((FAILED_LINE - 100))
              echo "=== Lines $START_LINE to $FAILED_LINE ==="
              sed -n "${START_LINE},${FAILED_LINE}p" build.log
            fi
            echo ""
            echo "=== First 100 lines (build start) ==="
            head -100 build.log
            exit $BUILD_EXIT_CODE
          fi

          echo "=== BUILD SUCCESS ==="
          echo "=== Generated files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          ls -la bin/ 2>/dev/null || echo "No bin directory"

      - name: Find APK files
        if: always()
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== bin directory ==="
          ls -la bin/ 2>/dev/null || echo "No bin directory"
          echo "=== build.log exists? ==="
          ls -la build.log 2>/dev/null || echo "No build.log"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: offline-qa-apk
          path: |
            **/*.apk
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
